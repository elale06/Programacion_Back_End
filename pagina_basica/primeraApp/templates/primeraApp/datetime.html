{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fecha y Hora</title>
    <link rel="stylesheet" href="{% static 'primeraApp/css/datetime.css' %}" />
</head>
<body>
    <button class="back-btn" type="button" data-go-back data-fallback="/" aria-label="Volver a la pagina anterior">
        ← Volver
    </button>
    <main class="panel">
        <h1>Fecha y Hora Actual</h1>
        <p class="subtitle">Vista mejorada de fecha y hora del servidor</p>
        <section class="clock" data-iso-initial="{{ iso_initial }}">
            <span id="date" class="date">{{ formatted_date }}</span>
            <span id="time" class="time">{{ formatted_time }}</span>
        </section>
    </main>
    <script src="{% static 'primeraApp/js/navigation.js' %}"></script>
    <script src="{% static 'primeraApp/js/datetime.js' %}"></script>
</body>
</html>
